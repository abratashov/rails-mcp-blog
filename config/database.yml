default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

development:
  primary:
    <<: *default
    database: rails_mcp_blog_development
  cable:
    <<: *default
    database: rails_mcp_blog_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: rails_mcp_blog_test

production:
  primary:
    <<: *default
    database: rails_mcp_blog_production
  cache:
    <<: *default
    database: rails_mcp_blog_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: rails_mcp_blog_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: rails_mcp_blog_production_cable
    migrations_paths: db/cable_migrate
